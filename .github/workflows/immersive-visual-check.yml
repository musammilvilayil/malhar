name: Immersive visual check

on:
  push:
    branches:
      - immersive-campus-tour-v1
  workflow_dispatch:

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install app dependencies
        working-directory: frontend
        run: npm install

      - name: Install visual check tools
        working-directory: frontend
        run: npm install --no-save playwright@1.55.0 serve@14.2.4

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Start local production build
        working-directory: frontend
        run: |
          npx serve -s build -l 4173 > /tmp/malhar-serve.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/malhar-serve.log
          exit 1

      - name: Run desktop and mobile screen checks
        working-directory: frontend
        run: node scripts/immersive-visual-check.mjs

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immersive-visual-artifacts
          path: frontend/visual-artifacts
          if-no-files-found: warn
          retention-days: 7
